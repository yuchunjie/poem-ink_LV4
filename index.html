<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我愛讀詩 ‧ 水墨雅集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
/* ===== 宋韻雅集・水墨美學設計系統 ===== */
:root {
  --bg-rice: #f4eee0;
  --bg-page: #e9e2d0;
  --bg-card: #fdfaf2;
  --ink-900: #1c1816;
  --ink-800: #2b2622;
  --ink-700: #3a322b;
  --ink-500: #6b5f52;
  --ink-300: #9e9180;
  --cinnabar: #b03026;
  --cinnabar-light: rgba(176, 48, 38, 0.14);
  --cinnabar-glow: rgba(176, 48, 38, 0.28);
  --gold: #b38838;
  --gold-light: rgba(179, 136, 56, 0.15);
  --gold-glow: rgba(220, 180, 80, 0.4);
  --border-ink: #42382c;
  --shadow-warm: 0 4px 20px rgba(45, 35, 20, 0.12);
  --font-serif: "Noto Serif TC", "Songti TC", "BiauKai", "PMingLiU", serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0 auto;
  max-width: 1440px;
  background: var(--bg-page);
  color: var(--ink-900);
  font-family: var(--font-serif);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background-image: radial-gradient(circle at 50% 0%, #f6efe2 0%, var(--bg-page) 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* 頂部 Header & 雙模組膠囊 */
#header {
  padding: 12px 18px 6px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid rgba(66, 56, 44, 0.18);
}
.title-group {
  display: flex;
  align-items: center;
  gap: 10px;
}
.seal-icon {
  width: 32px;
  height: 32px;
  background: var(--cinnabar);
  color: #fdfaf2;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 18px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.4);
  box-shadow: 0 2px 6px rgba(176,48,38,0.35);
  transform: rotate(-3deg);
}
h1 {
  margin: 0;
  font-size: clamp(20px, 3.6vw, 26px);
  font-weight: 900;
  letter-spacing: .25em;
  color: var(--ink-900);
  text-shadow: 0 1px 2px rgba(255,255,255,0.8);
}

/* 雙模組切換膠囊 (詩詞 24 / 名言 30) */
.module-tabs {
  display: inline-flex;
  background: rgba(66, 56, 44, 0.08);
  padding: 3px;
  border-radius: 30px;
  border: 1px solid rgba(66, 56, 44, 0.2);
}
.module-btn {
  padding: 6px 16px;
  border-radius: 24px;
  border: none;
  background: transparent;
  color: var(--ink-700);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .25s ease;
}
.module-btn.active {
  background: var(--ink-900);
  color: #fdfaf2;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

/* 篩選過濾列 (學期、學月) */
#filters {
  padding: 6px 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  background: rgba(244, 238, 224, 0.5);
}
.filter-group {
  display: flex;
  align-items: center;
  gap: 4px;
}
.filter-btn {
  padding: 4px 10px;
  border: 1px solid rgba(66, 56, 44, 0.25);
  background: #fcf8ee;
  border-radius: 14px;
  font-size: 12px;
  color: var(--ink-700);
  cursor: pointer;
  font-family: inherit;
  transition: all .2s;
}
.filter-btn.active {
  background: var(--cinnabar);
  color: #fff;
  border-color: var(--cinnabar);
  box-shadow: 0 2px 6px rgba(176,48,38,0.25);
}

/* 篇目橫向捲軸導覽 */
#chapter-nav {
  padding: 6px 16px 10px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  border-bottom: 1px solid rgba(66, 56, 44, 0.12);
}
#chapter-nav::-webkit-scrollbar {
  height: 4px;
}
#chapter-nav::-webkit-scrollbar-thumb {
  background: rgba(66, 56, 44, 0.25);
  border-radius: 2px;
}
.chap-btn {
  flex: 0 0 auto;
  font: inherit;
  font-size: 13px;
  padding: 5px 12px;
  min-height: 32px;
  border: 1px solid rgba(66, 56, 44, 0.25);
  background: #fbf6ea;
  border-radius: 4px;
  cursor: pointer;
  color: var(--ink-800);
  transition: all .2s;
  white-space: nowrap;
}
.chap-btn.active {
  background: var(--ink-900);
  color: #fdfaf2;
  border-color: var(--ink-900);
  box-shadow: 0 2px 6px rgba(0,0,0,0.18);
}
.chap-btn:hover:not(.active) {
  background: #eee4d0;
}

/* 舞台展示區 (左畫布 + 右書法宣紙卡片) */
#stage {
  display: flex;
  gap: 16px;
  padding: 10px 18px;
  align-items: stretch;
  flex: 1 0 auto;
}
#cv {
  flex: 1 1 540px;
  min-width: 0;
  width: 100%;
  height: auto;
  aspect-ratio: 5 / 3;
  object-fit: contain;
  border: 2px solid var(--border-ink);
  border-radius: 4px;
  box-shadow: var(--shadow-warm);
  display: block;
  background: var(--bg-rice);
  align-self: flex-start;
}
/* 書法直排展示 (全詩完整容納，絕不截斷) */
#poem {
  writing-mode: vertical-rl;
  flex: 0 0 clamp(280px, 29vw, 380px);
  min-height: 280px;
  background: var(--bg-card);
  border: 2px solid var(--border-ink);
  border-radius: 4px;
  box-shadow: var(--shadow-warm);
  padding: 22px 18px;
  font-size: clamp(18px, 1.9vw, 22px);
  line-height: 1.85;
  letter-spacing: .18em;
  user-select: none;
  box-sizing: border-box;
  overflow-x: auto;
  overflow-y: hidden;
  align-self: stretch;
}
#poem h2 {
  margin: 0 0 0 16px;
  font-size: 1.25em;
  font-weight: 900;
  letter-spacing: .24em;
  color: var(--ink-900);
}
#poem small {
  display: block;
  color: var(--cinnabar);
  font-size: .68em;
  font-weight: 600;
  margin-left: 16px;
  letter-spacing: .14em;
}
#poem p {
  margin: 0 0 0 12px;
  padding: 6px 4px;
  border-radius: 4px;
  cursor: pointer;
  transition: opacity .45s ease, transform .45s ease, background .25s ease, filter .45s ease, color .25s ease;
  position: relative;
}
#poem p:hover {
  background: rgba(176, 48, 38, 0.08);
}

/* ===== 跟讀動效 (Read-along / Follow-reading) ===== */
/* 未跟讀或讀畢停止時：全詩完整、平滑顯現 */
/* 朗讀進行中 (reading-mode)：未朗讀的句子隱藏，正在朗讀或已讀完的句子墨染顯現 */
#poem.reading-mode p {
  opacity: 0;
  transform: translateY(12px);
  filter: blur(3px);
  pointer-events: none;
}
#poem.reading-mode p.read-revealed {
  opacity: 0.88;
  transform: translateY(0);
  filter: blur(0);
  pointer-events: auto;
}
#poem.reading-mode p.active,
#poem p.active {
  opacity: 1 !important;
  transform: translateY(0) scale(1.02);
  filter: blur(0) !important;
  background: var(--cinnabar-light) !important;
  outline: 1px dashed rgba(176, 48, 38, 0.5);
  color: var(--cinnabar);
  font-weight: 600;
}

/* 底端懸浮磨砂控制台 */
#ctl-dock {
  position: sticky;
  bottom: 0;
  z-index: 100;
  margin: 8px 18px 14px;
  padding: 10px 16px;
  background: rgba(248, 243, 232, 0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(66, 56, 44, 0.35);
  border-radius: 40px;
  box-shadow: 0 8px 30px rgba(45, 30, 15, 0.16);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.ctl-btn-group {
  display: flex;
  align-items: center;
  gap: 6px;
}
.ctl-btn {
  padding: 7px 14px;
  border: 1px solid rgba(66, 56, 44, 0.3);
  background: #fdfaf2;
  border-radius: 20px;
  font-family: inherit;
  font-size: 13px;
  color: var(--ink-800);
  cursor: pointer;
  transition: all .2s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.ctl-btn:hover {
  background: #f4ecda;
  border-color: var(--ink-700);
}
.ctl-btn.primary {
  background: var(--cinnabar);
  color: #fff;
  border-color: var(--cinnabar);
  box-shadow: 0 2px 8px rgba(176, 48, 38, 0.3);
}
.ctl-btn.primary:hover {
  background: #98281f;
}
.ctl-btn.active {
  background: var(--ink-900);
  color: #fff;
  border-color: var(--ink-900);
}
.ctl-select {
  padding: 5px 8px;
  border: 1px solid rgba(66, 56, 44, 0.3);
  border-radius: 12px;
  background: #fdfaf2;
  font-family: inherit;
  font-size: 12px;
  color: var(--ink-800);
  cursor: pointer;
}

/* 賞析解說抽屜 (典藏卡片三欄展示) */
#ex {
  display: none;
  margin: 0 18px 16px;
  padding: 16px 20px;
  background: rgba(253, 250, 242, 0.96);
  border: 1px solid rgba(66, 56, 44, 0.25);
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(45, 35, 20, 0.08);
}
#ex.on {
  display: block;
  animation: slideDown .3s ease-out;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
#ex-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(66, 56, 44, 0.15);
}
#ex-body {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.ex-card {
  background: #f9f4e6;
  border: 1px solid rgba(66, 56, 44, 0.15);
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 14px;
  line-height: 1.65;
  color: var(--ink-800);
  transition: all .25s ease;
}
.ex-card b {
  color: var(--cinnabar);
  display: inline-block;
  margin-bottom: 4px;
}
.ex-card-title {
  color: var(--cinnabar);
  font-weight: 700;
  margin-bottom: 8px;
  display: block;
}
.vocab-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.vocab-row {
  line-height: 1.6;
  font-size: 14px;
}
.vocab-word {
  color: var(--cinnabar);
  font-weight: 700;
}
.vocab-colon {
  color: var(--ink-500);
}
.vocab-meaning {
  color: var(--ink-800);
}

/* 除錯訊息條 */
#dbg {
  font-size: 10px;
  color: var(--ink-300);
  text-align: center;
  padding: 4px;
}

/* 響應式佈局 */
@media (max-width: 860px) {
  #stage {
    flex-direction: column;
  }
  #poem-wrap {
    flex: 1 1 auto;
    height: 220px;
  }
  #ctl-dock {
    border-radius: 12px;
    margin: 8px;
  }
}
</style>
</head>
<body>

<header id="header">
  <div class="title-group">
    <div class="seal-icon" id="seal-mark">詩</div>
    <h1>我愛讀詩 ‧ 水墨雅集</h1>
  </div>
  <div class="module-tabs">
    <button class="module-btn active" id="tab-poem" onclick="switchMode('poem')">🏮 經典詩詞 (24)</button>
    <button class="module-btn" id="tab-quote" onclick="switchMode('quote')">📜 名言佳句 (30)</button>
  </div>
</header>

<div id="filters">
  <div class="filter-group" id="sem-filters">
    <button class="filter-btn active" onclick="setSemesterFilter('all')">全部</button>
    <button class="filter-btn" onclick="setSemesterFilter(0)">上學期</button>
    <button class="filter-btn" onclick="setSemesterFilter(1)">下學期</button>
  </div>
  <div class="filter-group" id="month-filters" style="display:none">
    <span style="font-size:12px;color:var(--ink-500);margin-left:6px">學月：</span>
    <button class="filter-btn active" onclick="setMonthFilter('all')">全月</button>
    <button class="filter-btn" onclick="setMonthFilter(1)">第一學月</button>
    <button class="filter-btn" onclick="setMonthFilter(2)">第二學月</button>
    <button class="filter-btn" onclick="setMonthFilter(3)">第三學月</button>
  </div>
</div>

<div id="chapter-nav"></div>

<main id="stage">
  <canvas id="cv" width="1500" height="900"></canvas>
  <div id="poem"></div>
</main>

<div id="ctl-dock">
  <div class="ctl-btn-group">
    <button class="ctl-btn" id="pr">← 上一首</button>
    <button class="ctl-btn primary" id="sp">🔊 朗讀</button>
    <button class="ctl-btn" id="ss">⏹ 停止</button>
    <button class="ctl-btn" id="nx">下一首 →</button>
    <button class="ctl-btn" id="rp">↻ 重播</button>
  </div>
  <div class="ctl-btn-group">
    <label style="font-size:13px;display:inline-flex;align-items:center;gap:4px">
      語速
      <select id="rt" class="ctl-select">
        <option value=".6">慢 .6</option>
        <option value=".8" selected>適中 .8</option>
        <option value="1">快 1.0</option>
      </select>
    </label>
    <button class="ctl-btn" id="exb">📖 賞析解說</button>
    <label style="font-size:13px;display:inline-flex;align-items:center;gap:4px">
      <input type="checkbox" id="au" checked> 自動朗讀
    </label>
  </div>
  <div id="vn" style="font-size:11px;color:var(--ink-500);flex:1 1 100%"></div>
</div>

<section id="ex">
  <div id="ex-header">
    <span style="font-weight:900;font-size:17px;color:var(--cinnabar)">📜 典藏賞析與釋義</span>
    <button class="ctl-btn" id="exs" style="padding:4px 12px;min-height:30px">🔊 聽解說</button>
  </div>
  <div id="ex-body"></div>
</section>

<div id="dbg"></div>

<script>
// ===== 畫布與狀態管理 =====
const cv = document.getElementById('cv'), c = cv.getContext('2d');
let T=0, Q=0, R=0, N=0, t0=null, cur=0, mix=0;
let curMode = 'poem'; // 'poem' | 'quote'
let curSem = 'all';  // 'all' | 0 | 1
let curMonth = 'all';// 'all' | 1 | 2 | 3
let isReadingMode = false; // 跟讀狀態開關

const _er = new Set();
let dbgM = '';
const dbgR = () => {
  const d = document.getElementById('dbg');
  if (d) d.textContent = '宋韻水墨雅集 v31' + dbgM + [..._er].map(m=>' ｜錯誤：'+m).join('');
};
function err(e) {
  const m = String(e && e.message || e);
  if (_er.has(m)) return;
  _er.add(m);
  dbgR();
}
addEventListener('error', e => err(e.message));
dbgR();

const rd = i => {
  let x = Math.sin(i * 12.9898) * 43758.5453;
  return x - Math.floor(x);
};
const I = (a, col) => `rgba(${col || (N ? '225,225,215' : '30,30,32')},${a})`;

// ===== 完整的唐詩 39 個水墨圖元庫 =====
const E={
mt:(x,y,w,h,a,col)=>{h*=R;let g=c.createLinearGradient(0,y-h,0,y);g.addColorStop(0,I(a*.9,col));g.addColorStop(1,I(0,col));c.fillStyle=g;c.beginPath();c.moveTo(x-w/2,y);c.bezierCurveTo(x-w*.28,y-h*.25,x-w*.1,y-h*.95,x,y-h);c.bezierCurveTo(x+w*.12,y-h*.85,x+w*.25,y-h*.3,x+w/2,y);c.fill();c.strokeStyle=I(a*.5,col);c.lineWidth=1.2;for(let i=0;i<5;i++){c.beginPath();c.moveTo(x+(i-2)*w*.06,y-h*(.9-i*.1));c.lineTo(x+(i-2)*w*.09,y-h*(.4-i*.05));c.stroke()}
const hw=f=>w/2*Math.pow(1-f,.9);let sh=c.createLinearGradient(x,0,x+w/2,0);sh.addColorStop(0,I(0,col));sh.addColorStop(1,I(a*.35,col));c.fillStyle=sh;c.beginPath();c.moveTo(x,y-h);c.bezierCurveTo(x+w*.12,y-h*.85,x+w*.25,y-h*.3,x+w/2,y);c.lineTo(x+w*.04,y);c.closePath();c.fill();
c.lineCap='round';c.setLineDash([7,3,2,4]);for(let i=0;i<28;i++){const f=.08+rd(i*3+x)*.8,x0=x+(rd(i*5+y)*2-1)*hw(f)*.8,y0=y-h*f,d=x0>x?1:-1;c.strokeStyle=I(a*(.22+rd(i)*.2)*(1-f*.4),col);c.lineWidth=.7+rd(i+9)*.9;c.beginPath();c.moveTo(x0,y0);c.quadraticCurveTo(x0+d*w*.02,y0+h*.06,x0+d*w*.035,y0+h*(.1+rd(i+2)*.06));c.stroke()}c.setLineDash([]);
c.fillStyle=I(a*.75,col);for(let i=0;i<16;i++){const f=.1+rd(i*2+x+7)*.8,d=i%2?1:-1;c.beginPath();c.arc(x+d*hw(f)*(.82+rd(i)*.14),y-h*f,.9+rd(i+4)*1.3,0,7);c.fill()}},
mo:(x,y,r,dy=0)=>{y+=Math.min(Q,8)*dy;let g=c.createRadialGradient(x,y,r*.8,x,y,r*2.2);g.addColorStop(0,N?'rgba(255,250,210,.35)':'rgba(120,110,90,.18)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r*2.2,0,7);c.fill();c.fillStyle=N?'#fff6d8':'#fbf8ee';c.strokeStyle=I(.35);c.beginPath();c.arc(x,y,r,0,7);c.fill();c.stroke()},
sn:(x,y,r,rise=0)=>{y-=Math.min(Q,12)*rise;let g=c.createRadialGradient(x,y,r*.6,x,y,r*2);g.addColorStop(0,'rgba(220,90,60,.35)');g.addColorStop(1,'rgba(220,90,60,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r*2,0,7);c.fill();c.fillStyle='rgba(176,48,38,.9)';c.beginPath();c.arc(x,y,r,0,7);c.fill()},
wa:(y,h,a=.4)=>{let g=c.createLinearGradient(0,y,0,y+h);g.addColorStop(0,I(.02));g.addColorStop(1,I(.12));c.fillStyle=g;c.fillRect(0,y,1000,h);c.lineCap='round';
for(let i=0;i<20;i++){const f=i/19,yy=y+h*f*f*.98+2,amp=1+f*f*4,fr=.05-.03*f,sp=.7+f*.9;c.strokeStyle=I(a*(.3+.6*f)*(1-f*.3));c.lineWidth=.6+f*1.5;c.beginPath();for(let x=0;x<=1000;x+=14){const v=yy+Math.sin(x*fr+T*sp+i*1.7)*amp+Math.sin(x*fr*2.3-T*sp*.6+i)*amp*.4;x?c.lineTo(x,v):c.moveTo(x,v)}c.stroke();
c.strokeStyle=I(a*.9*(.2+f));c.lineWidth=.8+f;c.beginPath();for(let k=0;k<4;k++){const gx=(rd(i*9+k)*1000+T*(6+f*10))%1000;c.moveTo(gx,yy+Math.sin(gx*fr+T*sp+i*1.7)*amp-1);c.lineTo(gx+6+f*14,yy+Math.sin((gx+8)*fr+T*sp+i*1.7)*amp-1)}c.stroke()}},
bo:(x,y,s,vx=0,lamp=0,sh=0)=>{let k=Math.min(Q,14);x+=k*vx;s*=Math.max(.3,1-sh*k);y+=Math.sin(T*1.5)*2;const ink=I(.88),fold=N?'rgba(25,28,40,.45)':'rgba(240,235,220,.4)';
c.strokeStyle=I(.28);c.lineWidth=1.1;for(let q=0;q<2;q++){c.beginPath();c.ellipse(x,y+8*s,(40+q*9+Math.sin(T*.9+q)*3)*s,(4+q*1.5)*s,0,0,7);c.stroke()}

    for (let q = 0; q < 5; q++) {
      const ph = (T * 1.5 + q * .2) % 1;
      const px = (q - 2) * 12 * s;
      const py = -20 * s - ph * 40 * s;
      c.fillStyle = `rgba(220,180,80,${1 - ph})`;
      c.beginPath();
      c.arc(px, py, (1.5 + q % 2) * s, 0, 7);
      c.fill();
    }
    c.restore();
  },

  // B. 金幣與食鳥 (cn: Coins & bird bait)
  cn: (x, y, s) => {
    c.save();
    c.translate(x, y);
    // 銅錢金幣疊放
    for (let i = 0; i < 4; i++) {
      const ox = (i - 1.5) * 18 * s, oy = Math.sin(T + i) * 2 * s;
      c.fillStyle = 'rgba(212,175,55,0.92)';
      c.beginPath();
      c.arc(ox, oy, 12 * s, 0, 7);
      c.fill();
      c.strokeStyle = '#8a6518';
      c.lineWidth = 1.2 * s;
      c.stroke();
      // 方孔
      c.fillStyle = '#f4eee0';
      c.fillRect(ox - 3 * s, oy - 3 * s, 6 * s, 6 * s);
      c.strokeRect(ox - 3 * s, oy - 3 * s, 6 * s, 6 * s);
    }
    c.restore();
  },

  // C. 芳草野火與新芽 (wf: Wild grass, prairie flames & tender sprouts)
  wf: (x, y, s) => {
    c.save();
    c.translate(x, y);
    // 燃燒墨焰粒子
    for (let i = 0; i < 18; i++) {
      const fx = (rd(i) - .5) * 160 * s;
      const ph = (T * 2.5 + i * .15) % 1;
      const fy = -ph * 60 * s;
      const r = (8 - ph * 6) * s;
      c.fillStyle = `rgba(${i%2 ? '220,80,40' : '240,160,50'},${(1 - ph) * .8})`;
      c.beginPath();
      c.arc(fx, fy, r, 0, 7);
      c.fill();
    }
    // 春風吹撫之碧綠新芽
    c.strokeStyle = 'rgba(100,160,80,0.88)';
    c.lineWidth = 2 * s;
    for (let j = 0; j < 12; j++) {
      const gx = (j - 5.5) * 16 * s;
      const sw = Math.sin(T * 3 + j) * 6 * s;
      c.beginPath();
      c.moveTo(gx, 0);
      c.quadraticCurveTo(gx + sw, -15 * s, gx + sw * 1.5, -30 * s);
      c.stroke();
    }
    c.restore();
  },

  // D. 駿馬奔騰 (gh: Galloping steed with physical 4-beat gait)
  gh: (x, y, s) => {
    const ph = T * 7;
    const ink = I(.9);
    c.save();
    c.translate(x, y);
    // 馬身與四蹄擺動
    const l1 = Math.sin(ph) * 15 * s, l2 = Math.cos(ph) * 15 * s;
    c.strokeStyle = ink;
    c.lineWidth = 5 * s;
    // 後腿
    c.beginPath(); c.moveTo(-25 * s, -15 * s); c.lineTo(-35 * s + l1, 10 * s); c.stroke();
    c.beginPath(); c.moveTo(-20 * s, -15 * s); c.lineTo(-28 * s - l1, 10 * s); c.stroke();
    // 馬身
    c.fillStyle = ink;
    c.beginPath();
    c.ellipse(0, -22 * s, 34 * s, 16 * s, 0, 0, 7);
    c.fill();
    // 前腿
    c.beginPath(); c.moveTo(20 * s, -15 * s); c.lineTo(30 * s + l2, 10 * s); c.stroke();
    c.beginPath(); c.moveTo(25 * s, -15 * s); c.lineTo(35 * s - l2, 10 * s); c.stroke();
    // 頸與首
    c.beginPath();
    c.moveTo(18 * s, -28 * s);
    c.lineTo(38 * s, -52 * s);
    c.lineTo(48 * s, -45 * s);
    c.lineTo(32 * s, -18 * s);
    c.closePath();
    c.fill();
    // 飛揚鬃毛與馬尾
    c.lineWidth = 2 * s;
    c.beginPath();
    c.moveTo(-32 * s, -22 * s);
    c.quadraticCurveTo(-50 * s + Math.sin(ph) * 10 * s, -35 * s, -55 * s, -15 * s);
    c.stroke();
    // 奔蹄揚起的水墨塵土
    for (let d = 0; d < 5; d++) {
      const dph = (T * 4 + d * .2) % 1;
      c.fillStyle = `rgba(140,120,90,${(1 - dph) * .4})`;
      c.beginPath();
      c.arc(-40 * s - dph * 30 * s, 8 * s - dph * 10 * s, (4 + dph * 8) * s, 0, 7);
      c.fill();
    }
    c.restore();
  },

  // E. 端硯朱印 (is: Inkstone & cinnabar seal)
  is: (x, y, s) => {
    c.save();
    c.translate(x, y);
    // 黑色端石硯台
    c.fillStyle = '#1c1b1a';
    c.beginPath();
    c.roundRect ? c.roundRect(-40 * s, -25 * s, 80 * s, 50 * s, 10 * s) : c.rect(-40 * s, -25 * s, 80 * s, 50 * s);
    c.fill();
    // 硯池墨水微光
    c.fillStyle = '#0a0908';
    c.beginPath();
    c.ellipse(-10 * s, 0, 22 * s, 14 * s, 0, 0, 7);
    c.fill();
    // 水墨反光
    c.fillStyle = 'rgba(255,255,255,0.15)';
    c.beginPath();
    c.ellipse(-14 * s, -4 * s, 8 * s, 4 * s, -.3, 0, 7);
    c.fill();
    // 朱砂印泥印章 (鮮明紅色)
    c.fillStyle = 'rgba(186,48,38,0.95)';
    c.fillRect(15 * s, -18 * s, 20 * s, 36 * s);
    c.strokeStyle = '#f4eee0';
    c.lineWidth = 1.2 * s;
    c.strokeRect(17 * s, -16 * s, 16 * s, 32 * s);
    c.restore();
  },

  // F. 精誠金石 (gs: Stone opening with light burst)
  gs: (x, y, s) => {
    c.save();
    c.translate(x, y);
    // 巨石輪廓
    c.fillStyle = I(.85, '80,75,70');
    c.beginPath();
    c.moveTo(-45 * s, 25 * s);
    c.lineTo(-55 * s, -20 * s);
    c.lineTo(-15 * s, -45 * s);
    c.lineTo(35 * s, -40 * s);
    c.lineTo(55 * s, 25 * s);
    c.closePath();
    c.fill();
    // 劈開之金光裂隙
    const gl = Math.sin(T * 4) * .2 + .8;
    c.strokeStyle = `rgba(255,220,100,${gl})`;
    c.lineWidth = 4 * s;
    c.beginPath();
    c.moveTo(-10 * s, -44 * s);
    c.lineTo(5 * s, -10 * s);
    c.lineTo(-2 * s, 15 * s);
    c.lineTo(8 * s, 25 * s);
    c.stroke();
    // 放射金芒
    let g = c.createRadialGradient(0, 0, 2, 0, 0, 50 * s);
    g.addColorStop(0, `rgba(255,215,80,${.8 * gl})`);
    g.addColorStop(1, 'rgba(255,215,80,0)');
    c.fillStyle = g;
    c.beginPath();
    c.arc(0, 0, 50 * s, 0, 7);
    c.fill();
    c.restore();
  },

  // G. 翠竹修長 (bg: Bamboo grove)
  bg: (x, y, s) => {
    c.save();
    c.translate(x, y);
    const wn = Math.sin(T * 1.2) * 5 * s;
    c.strokeStyle = I(.75, '70,110,65');
    c.lineWidth = 5 * s;
    // 兩根修竹
    for (let b = -1; b <= 1; b += 2) {
      const bx = b * 22 * s;
      c.beginPath();
      c.moveTo(bx, 0);
      c.quadraticCurveTo(bx + wn * .4, -60 * s, bx + wn, -140 * s);
      c.stroke();
      // 竹節環
      c.strokeStyle = I(.9, '45,75,40');
      c.lineWidth = 7 * s;
      for (let j = 1; j <= 4; j++) {
        const jy = -j * 28 * s;
        c.beginPath();
        c.moveTo(bx - 4 * s + wn * (j / 5), jy);
        c.lineTo(bx + 4 * s + wn * (j / 5), jy);
        c.stroke();
      }
      // 竹葉
      c.fillStyle = I(.7, '75,125,70');
      for (let k = 0; k < 6; k++) {
        const ly = -40 * s - k * 16 * s;
        c.beginPath();
        c.ellipse(bx + 12 * s + wn, ly, 14 * s, 3.5 * s, .5 + Math.sin(T + k) * .1, 0, 7);
        c.fill();
      }
    }
    c.restore();
  },

  // H. 清水與酒器 (cw: Stream & Bronze Zun vessel)
  cw: (x, y, s) => {
    c.save();
    c.translate(x, y);
    // 古青銅酒尊
    c.fillStyle = I(.9, '75,95,85');
    c.beginPath();
    c.moveTo(-16 * s, -30 * s);
    c.lineTo(16 * s, -30 * s);
    c.lineTo(10 * s, 0);
    c.lineTo(18 * s, 10 * s);
    c.lineTo(-18 * s, 10 * s);
    c.lineTo(-10 * s, 0);
    c.closePath();
    c.fill();
    // 尊身饕餮紋線
    c.strokeStyle = I(.5, '200,225,210');
    c.lineWidth = 1 * s;
    c.stroke();
    // 清澈泉水水流
    c.strokeStyle = 'rgba(160,200,230,0.6)';
    c.lineWidth = 2 * s;
    for (let w = -2; w <= 2; w++) {
      c.beginPath();
      c.moveTo(-50 * s, 16 * s + w * 4 * s);
      c.quadraticCurveTo(0, 14 * s + Math.sin(T * 2 + w) * 3 * s, 50 * s, 16 * s + w * 4 * s);
      c.stroke();
    }
    c.restore();
  },

  // I. 錦箱與棉絮 (bx: Brocade box)
  bx: (x, y, s) => {
    c.save();
    c.translate(x, y);
    // 華麗漆盒
    c.fillStyle = '#8a241c';
    c.fillRect(-30 * s, -15 * s, 60 * s, 30 * s);
    // 金色鎖扣
    c.fillStyle = '#d4af37';
    c.fillRect(-6 * s, -6 * s, 12 * s, 12 * s);
    // 掀開一角之破舊棉絮
    c.fillStyle = 'rgba(215,210,200,0.85)';
    for (let k = 0; k < 6; k++) {
      c.beginPath();
      c.arc((k - 2.5) * 8 * s + Math.sin(T + k) * 3 * s, -22 * s, (4 + k % 2) * s, 0, 7);
      c.fill();
    }
    c.restore();
  },

  // J. 和諧三心 (hr: Three concentric ripples & floating lotus)
  hr: (x, y, s) => {
    c.save();
    c.translate(x, y);
    for (let r = 0; r < 3; r++) {
      const ph = (T * .6 + r / 3) % 1;
      const rad = ph * 50 * s;
      c.strokeStyle = `rgba(180,140,70,${1 - ph})`;
      c.lineWidth = 1.6 * s;
      c.beginPath();
      c.ellipse(0, 0, rad, rad * .4, 0, 0, 7);
      c.stroke();
    }
    // 水中粉蓮
    c.fillStyle = 'rgba(225,120,140,0.9)';
    c.beginPath();
    c.arc(0, -4 * s, 6 * s, 0, 7);
    c.fill();
    c.restore();
  },

  // K. 稻穗與織機 (fl: Golden crops & silk loom)
  fl: (x, y, s) => {
    c.save();
    c.translate(x, y);
    // 垂穗稻穀
    const sw = Math.sin(T * 1.5) * 4 * s;
    c.strokeStyle = '#c8a032';
    c.lineWidth = 2.4 * s;
    c.beginPath();
    c.moveTo(-20 * s, 20 * s);
    c.quadraticCurveTo(-10 * s, -20 * s, 25 * s + sw, -15 * s);
    c.stroke();
    // 穀粒
    c.fillStyle = '#d8b242';
    for (let g = 0; g < 8; g++) {
      c.beginPath();
      c.ellipse(10 * s + g * 3 * s + sw, -22 * s + g * 2 * s, 3.5 * s, 2 * s, .5, 0, 7);
      c.fill();
    }
    // 織布梭子穿線
    const shX = Math.sin(T * 3) * 25 * s;
    c.fillStyle = '#8a5028';
    c.beginPath();
    c.ellipse(shX, 10 * s, 10 * s, 3 * s, 0, 0, 7);
    c.fill();
    c.strokeStyle = 'rgba(220,70,60,0.7)';
    c.lineWidth = 1 * s;
    c.beginPath();
    c.moveTo(-30 * s, 10 * s);
    c.lineTo(shX, 10 * s);
    c.stroke();
    c.restore();
  },

  // L. 懸崖斷壁 (cf: Cliff & mist)
  cf: (x, y, s) => {
    c.save();
    c.translate(x, y);
    c.fillStyle = I(.85, '55,50,48');
    c.beginPath();
    c.moveTo(-60 * s, 50 * s);
    c.lineTo(-20 * s, -50 * s);
    c.lineTo(10 * s, -50 * s);
    c.lineTo(-10 * s, 50 * s);
    c.closePath();
    c.fill();
    // 崖邊雲霧迷濛
    let g = c.createRadialGradient(15 * s, 0, 5 * s, 15 * s, 0, 45 * s);
    g.addColorStop(0, 'rgba(240,235,220,.65)');
    g.addColorStop(1, 'rgba(240,235,220,0)');
    c.fillStyle = g;
    c.beginPath();
    c.arc(15 * s, 0, 45 * s, 0, 7);
    c.fill();
    c.restore();
  },

  // M. 匠人工坊 (tl: Artisan bench & keen tools)
  tl: (x, y, s) => {
    c.save();
    c.translate(x, y);
    // 木工長凳
    c.fillStyle = '#7a5230';
    c.fillRect(-40 * s, 0, 80 * s, 8 * s);
    c.fillRect(-35 * s, 8 * s, 6 * s, 20 * s);
    c.fillRect(29 * s, 8 * s, 6 * s, 20 * s);
    // 鋒利刨刀與刨花
    c.fillStyle = '#3a3430';
    c.fillRect(-15 * s, -8 * s, 30 * s, 8 * s);
    c.strokeStyle = '#e8d4a2';
    c.lineWidth = 1.5 * s;
    // 捲曲刨花
    c.beginPath();
    c.arc(20 * s + Math.sin(T * 2) * 2 * s, -4 * s, 6 * s, 0, 5);
    c.stroke();
    c.restore();
  },

  // N. 魯國欹器 (qq: Qiqi vessel: empty tilts, half stands, full dumps!)
  qq: (x, y, s) => {
    c.save();
    c.translate(x, y);
    // 支撐架
    c.strokeStyle = I(.85, '70,55,40');
    c.lineWidth = 4 * s;
    c.beginPath();
    c.moveTo(-32 * s, 30 * s);
    c.lineTo(0, -25 * s);
    c.lineTo(32 * s, 30 * s);
    c.stroke();
    // 物理力學循環：週期 6 秒 (0-2s 傾斜空器, 2-4s 中正半滿, 4-5.5s 水滿傾覆傾倒)
    const cyc = (T % 6);
    let rot = 0, waterLevel = 0;
    if (cyc < 2) {
      rot = -0.4 + Math.sin(cyc * 3) * .05; // 虛則欹
      waterLevel = cyc / 2 * 0.4;
    } else if (cyc < 4) {
      rot = 0 + Math.sin(cyc * 2) * .02;   // 中則正
      waterLevel = 0.4 + (cyc - 2) / 2 * 0.5;
    } else {
      rot = 1.35 * Math.sin((cyc - 4) * 2); // 滿則覆
      waterLevel = Math.max(0, 0.9 - (cyc - 4) * 0.8);
    }
    // 旋轉欹器主體
    c.save();
    c.translate(0, -10 * s);
    c.rotate(rot);
    // 銅器輪廓
    c.fillStyle = I(.9, '85,115,100');
    c.beginPath();
    c.moveTo(-16 * s, -18 * s);
    c.lineTo(16 * s, -18 * s);
    c.lineTo(20 * s, 8 * s);
    c.lineTo(0, 24 * s);
    c.lineTo(-20 * s, 8 * s);
    c.closePath();
    c.fill();
    // 注入水花與溢流
    if (waterLevel > 0.1) {
      c.fillStyle = 'rgba(120,180,220,0.7)';
      c.beginPath();
      c.arc(0, 10 * s, 12 * s * waterLevel, 0, 7);
      c.fill();
    }
    c.restore();
    c.restore();
  },

  // O. 樹上鳥巢 (nt: Tree nest & eggs)
  nt: (x, y, s) => {
    c.save();
    c.translate(x, y);
    // 樹杈鳥巢
    c.fillStyle = '#6a4e32';
    c.beginPath();
    c.ellipse(0, 0, 18 * s, 10 * s, 0, 0, 7);
    c.fill();
    // 巢中白卵
    c.fillStyle = '#f8f4ec';
    c.beginPath();
    c.ellipse(-5 * s, -4 * s, 4 * s, 3 * s, -.2, 0, 7);
    c.ellipse(5 * s, -4 * s, 4 * s, 3 * s, .2, 0, 7);
    c.fill();
    c.restore();
  },

  // P. 青瓷茶盞 (tc: Celadon teacup with swirling steam)
  tc: (x, y, s) => {
    c.save();
    c.translate(x, y);
    // 瓷盞
    c.fillStyle = '#a8c6b4';
    c.beginPath();
    c.moveTo(-16 * s, -12 * s);
    c.lineTo(16 * s, -12 * s);
    c.bezierCurveTo(14 * s, 10 * s, -14 * s, 10 * s, -16 * s, -12 * s);
    c.fill();
    // 裊裊茶煙
    c.strokeStyle = 'rgba(235,230,215,0.45)';
    c.lineWidth = 1.5 * s;
    for (let k = -1; k <= 1; k++) {
      const ox = k * 6 * s;
      c.beginPath();
      c.moveTo(ox, -14 * s);
      c.quadraticCurveTo(ox + Math.sin(T * 2 + k) * 8 * s, -30 * s, ox + Math.cos(T * 1.5 + k) * 6 * s, -45 * s);
      c.stroke();
    }
    c.restore();
  },

  // Q. 書山萬卷 (bm: Towering mountain of books & scholar boat)
  bm: (x, y, s) => {
    c.save();
    c.translate(x, y);
    // 書籍堆疊成峰
    for (let l = 0; l < 5; l++) {
      const bw = (70 - l * 12) * s;
      const by = 20 * s - l * 16 * s;
      c.fillStyle = l % 2 ? '#3a4b60' : '#8a3c2e';
      c.fillRect(-bw / 2, by, bw, 12 * s);
      c.strokeStyle = '#f4eee0';
      c.lineWidth = 1 * s;
      c.strokeRect(-bw / 2, by, bw, 12 * s);
    }
    c.restore();
  },

  // R. 枯木與長青松 (lt: Withered vs Pine tree)
  lt: (x, y, s) => {
    c.save();
    c.translate(x, y);
    // 左：枯木蕭索
    c.strokeStyle = I(.65, '70,60,55');
    c.lineWidth = 4 * s;
    c.beginPath();
    c.moveTo(-25 * s, 30 * s);
    c.lineTo(-30 * s, -20 * s);
    c.lineTo(-45 * s, -50 * s);
    c.moveTo(-30 * s, -20 * s);
    c.lineTo(-18 * s, -40 * s);
    c.stroke();
    // 右：松柏長青
    c.strokeStyle = I(.85, '55,45,40');
    c.lineWidth = 4.5 * s;
    c.beginPath();
    c.moveTo(25 * s, 30 * s);
    c.lineTo(25 * s, -20 * s);
    c.stroke();
    c.fillStyle = I(.8, '50,110,65');
    for (let m = 0; m < 3; m++) {
      c.beginPath();
      c.arc(25 * s, -20 * s - m * 18 * s, (16 - m * 3) * s, 0, 7);
      c.fill();
    }
    c.restore();
  },

  // S. 鐵犁春耕 (pl: Plow in fertile field)
  pl: (x, y, s) => {
    c.save();
    c.translate(x, y);
    // 彎鐵犁
    c.strokeStyle = '#322d28';
    c.lineWidth = 3.5 * s;
    c.beginPath();
    c.moveTo(-20 * s, 10 * s);
    c.quadraticCurveTo(0, -10 * s, 25 * s, -20 * s);
    c.stroke();
    // 翻出泥土黑土
    c.fillStyle = '#4a3d32';
    c.beginPath();
    c.ellipse(-15 * s, 14 * s, 18 * s, 6 * s, -.2, 0, 7);
    c.fill();
    c.restore();
  },

  // T. 祥雲干戈 (pw: Peaceful cloud vs halberds)
  pw: (x, y, s) => {
    c.save();
    c.translate(x, y);
    // 和善紫氣祥雲
    c.fillStyle = 'rgba(165,130,175,0.6)';
    c.beginPath();
    c.arc(-24 * s, -10 * s, 18 * s, 0, 7);
    c.arc(-10 * s, -18 * s, 14 * s, 0, 7);
    c.fill();
    // 凶險干戈兵器
    c.strokeStyle = '#485055';
    c.lineWidth = 3 * s;
    c.beginPath();
    c.moveTo(10 * s, 15 * s); c.lineTo(35 * s, -25 * s);
    c.moveTo(35 * s, 15 * s); c.lineTo(10 * s, -25 * s);
    c.stroke();
    c.restore();
  },

  // U. 水瓶有聲 (wb: Water jars: full silent vs half sloshing)
  wb: (x, y, s) => {
    c.save();
    c.translate(x, y);
    // 左瓶：滿水沉靜
    c.fillStyle = '#688898';
    c.beginPath();
    c.roundRect ? c.roundRect(-42 * s, -15 * s, 24 * s, 36 * s, 6 * s) : c.rect(-42 * s, -15 * s, 24 * s, 36 * s);
    c.fill();
    // 右瓶：半瓶晃動有聲
    const sl = Math.sin(T * 4) * 0.25;
    c.save();
    c.translate(25 * s, 4 * s);
    c.rotate(sl);
    c.fillStyle = '#7a9aa8';
    c.beginPath();
    c.roundRect ? c.roundRect(-12 * s, -18 * s, 24 * s, 36 * s, 6 * s) : c.rect(-12 * s, -18 * s, 24 * s, 36 * s);
    c.fill();
    // 飛濺水花
    for (let w = 0; w < 3; w++) {

const EX=[["賀知章年輕時就離開了家鄉，到很老才回來。他說話還是老家的口音，耳邊的頭髮卻變得稀疏了。村裡的小孩看到他，都不認識，還笑著問：「客人，您從哪裡來呀？」", "鄉音：家鄉的口音。鬢毛：耳朵旁邊的頭髮。", "回到家鄉，家鄉的人卻把他當成客人，心裡又高興又心酸。"], ["月亮落下去了，烏鴉在樹上啼叫，天空好像飄著霜。江邊的楓樹和漁船的燈火，陪著睡不著的我。蘇州城外的寒山寺，半夜的鐘聲傳到了我的船上。", "夜泊：晚上把船停在岸邊。江楓：江邊的楓樹。", "旅途中的夜晚好安靜，鐘聲讓心裡的愁更深了。"], ["秋天的夜裡，銀白的蠟燭照著畫屏，光看起來冷冷的。宮女拿著小扇子，撲打飛來飛去的螢火蟲。夜色涼得像水，她躺在石階上，望著天上的牽牛星和織女星。", "銀燭：銀白色的蠟燭。輕羅小扇：用薄絲做的小圓扇。", "宮女好寂寞，只能看著星星想心事。"], ["我一個人住在別的地方，每到節日就更想念家人。我知道哥哥弟弟們正在爬高山，大家頭上都插著茱萸，卻少了我一個人。", "倍：更加。茱萸：一種有香氣的植物，重陽節那天，人們會帶著它登高。", "家人團聚時少了自己，思念就更深了。"], ["少年很容易變老，學問卻很難學成，所以連一寸的時間都不能隨便浪費。池塘邊的春草夢還沒醒，台階前的梧桐葉已經沙沙作響，秋天又到了。", "輕：看輕。春草夢：春天的美夢。", "時間過得很快，要趁年輕好好讀書。"], ["老朋友在黃鶴樓向我告別，在花開得像煙霧的三月，坐船往揚州去。那一片孤單的帆影越走越遠，消失在藍天的盡頭，只剩長江的水一直流向天邊。", "故人：老朋友。煙花：形容春天的花開得像一片煙霧。惟：只。", "李白一直望著船走遠，捨不得朋友離開。"], ["月亮和關口還是秦漢時代的樣子，可是去很遠的地方打仗的人，還沒有回來。要是名將李廣還在，就不會讓胡人的兵馬越過陰山。", "塞：邊境上重要的地方。還：回來。不教：不讓。度：越過。", "作者想念出征的士兵，也希望有好將軍保護國家。"], ["我勸你不要太愛惜華麗的衣服，要好好珍惜年輕的時光。花開得正美，就該摘下來，不要等到花謝了，才空著手去折枯枝。", "金縷衣：繡著金線的漂亮衣服。直須：儘管，不要猶豫。莫待：不要等到。", "時間不會等人，要趁現在把握好時光。"], ["半畝大的方形池塘，像一面打開的鏡子，天光和雲的影子在水裡來回移動。為什麼池水這麼清澈？因為源頭有活水不停流進來。", "方塘：一方水池。鑑：鏡子。", "常常學新東西，心裡才會像池水一樣清清亮亮。"], ["用葡萄釀的好酒，倒進夜光杯裡。正想喝的時候，琵琶聲響起，催大家出發了。就算醉倒在沙場上，請你別笑我。從古到今，打仗的人有幾個能平安回家呢？", "夜光杯：用白玉做的酒杯。催：催促。沙場：戰場。", "士兵一邊喝酒，一邊想著打仗的辛苦，有點無奈，也有點豪氣。"], ["遠遠看到一座高橋，被山野間的煙霧遮住了。我在河邊的石堆旁，向漁船上的人問路。桃花整天跟著流水漂走，桃花源的洞口，到底在清澈溪水的哪一邊呢？", "飛橋：很高的橋。石磯：河裡露出水面的石堆。", "作者想找到像仙境一樣的桃花源。"], ["慈祥的媽媽拿著針線，為要遠行的孩子縫衣服。她縫得又密又緊，是怕孩子很晚才回家。誰說小小的草心，報答得了春天陽光般的恩情呢？", "遊子：離開家鄉的人。三春暉：春天溫暖的陽光，比喻媽媽的愛。", "媽媽的愛藏在一針一線裡，我們一輩子也報答不完。"], ["天上的鳥兒都飛遠了，孤單的白雲也慢慢飄走。我望著山，山也望著我，我們誰都不嫌棄誰。這時陪著我的，只有敬亭山。", "盡：消失。閒：安靜。厭：厭倦。", "李白很孤單，所以把山當成了好朋友。"], ["從正面看，廬山是一排山嶺，從側面看，就變成高高的山峰。從遠、近、高、低不同的地方看，樣子都不一樣。我們看不清廬山的真面目，因為自己就在山裡面。", "題壁：把字寫在牆上。緣：因為。峰：山的尖頂。", "換個角度看事情，才能看得更清楚。"], ["黃河好像從遠方一直通到白雲裡，一座孤零零的城蓋在高山上。羌笛不用吹出哀怨的〈楊柳〉曲子，因為春風根本吹不到玉門關外。", "孤城：指玉門關。羌笛：羌族人的短笛。何須：何必。", "邊境的士兵離家很遠，春天好像也到不了那裡。"], ["我偶然走到松樹下，就枕著石頭睡著了。山裡沒有日曆，冬天過去了，我也不知道現在是哪一年。", "偶：偶然。高枕：安心地睡覺。曆日：記載日子和節氣的書。", "在山裡過著自由安靜的日子，連時間都忘了。"], ["美麗的女子捲起了珠簾，久久坐著，皺著眉頭。只看見她臉上的淚痕濕了一大片，不知道她心裡在怨誰。", "蹙蛾眉：皺起眉頭。深坐：久久呆坐。", "她很傷心，卻不說出口，讓人心疼。"], ["心裡很有感情，看起來卻好像沒有感情，因為太難過，連笑都笑不出來。桌上的蠟燭好像也捨不得分別，一滴一滴流下蠟油，替我們流淚到天亮。", "唯覺：只覺得。笑不成：想笑卻笑不出來。還惜別：也捨不得分開。", "太捨不得朋友，難過得說不出話。"], ["李白和杜甫的詩傳了很久，現在讀起來已經不覺得新鮮。每個朝代都會出現有才華的人，各自領導風潮好幾百年。", "李杜：李白和杜甫。江山：國家。", "寫作要有自己的新想法，不要只照著前人做。"], ["清明節的時候，細雨一直下，路上的行人心情很煩悶。我向牧童請問哪裡有酒店可以休息，牧童用手指著遠處的杏花村。", "紛紛：很多。欲斷魂：難過得好像靈魂要離開身體。借問：請問。", "淋著雨的旅人，因為牧童的指路，心裡有了方向。"], ["你問我什麼時候回去，我還不知道。巴山的夜晚正下著雨，雨水漲滿了秋天的池塘。什麼時候才能和你坐在西窗下一起剪燭花，說說今晚巴山夜雨的情景呢？", "何當：什麼時候才能。剪燭：把燒焦的燭芯剪掉，燭光才會亮。卻話：回頭再說。", "作者很想念親人，盼望能早點團聚。"], ["我在花叢中拿著一壺酒，一個人喝，沒有人陪。我舉起杯子邀請明月，再加上月光照出來的影子，就像三個人一起喝酒。", "獨酌：一個人喝酒。無相親：沒有親近的人。", "李白很孤單，所以想像月亮和影子是他的朋友。"], ["江上飄著細細的雨，岸邊的草長得很整齊。六朝的繁華像夢一樣過去了，只剩鳥兒空空地叫。最無情的是臺城的柳樹，還是像煙霧一樣罩著十里長堤。", "霏霏：細雨飄飛的樣子。六朝：金陵過去的六個朝代。臺城：六朝時的皇宮。", "人間的繁華會消失，大自然卻一直都在。"], ["半夜三更就點燈讀書，到天快亮、公雞啼叫的時候，正是男孩子讀書最好的時間。年輕時不知道要早點用功，等頭髮白了，才後悔沒有多讀書，已經太晚了。", "三更：半夜。五更：天快亮的時候。黑髮：年輕人。白首：老人。", "讀書要趁早，不要等老了才後悔。"]];

const QUOTES_EX = [["貧窮的人因為努力讀書而獲得財富，富有的人因為博學明理而受到眾人的敬重。", "因：憑藉、因為。富：充足、富有。貴：受人敬重、品格尊貴。", "讀書不僅能改善生活，更能提升一個人的涵養與心靈境界。"], ["人常為了爭奪金錢財富而招來禍患，鳥雀常為了貪吃誘餌而落入羅網喪命。", "為：因為。財：金錢財貨。食：食物。亡：死亡、滅亡。", "告誡我們切莫因一時的貪念而迷失理智，知足才能常樂、保全自身。"], ["世間本來平靜安和、沒有那麼多紛擾，往往是心胸狹隘或不明事理的人自己在心裡添煩惱。", "庸人：平庸愚昧的人。自擾：自己擾亂自己、自尋煩惱。", "心放平了，事情就簡單了；別為無謂的瑣事焦慮不安。"], ["冬天的野火縱然燒得再猛烈，也無法將草根燒盡；等到和煦的春風一吹，芳草又破土萌芽、生氣蓬勃。", "野火：荒野之火。盡：完全完畢。春風：春天的風。吹又生：又重新萌芽生長。", "象徵堅韌強大的生命力，只要希望的火種在，任何困境都打不倒我們。"], ["路途遙遠漫長，才能考驗出馬匹的耐力與腳力；相處的日子久了，才能真正看清一個人的品格與真心。", "遙：遠。馬力：馬匹的體力與奔馳耐力。見：看清、顯現。", "真正的好朋友和純潔的情誼，是禁得起時間與距離嚴苛考驗的。"], ["靠朱砂近的容易被染紅，靠墨硯近的容易被染黑。", "朱：朱砂，紅色顏料。赤：紅色。墨：墨汁。黑：黑色。", "環境對人的影響極為深遠，交朋友要謹慎，多與品格高尚的人為伍。"], ["只要人的心意無比真誠、專注而堅定，就算是如金石般堅硬的物體，也能被感化貫穿打通。", "精誠：真誠的心意與極致的專注。金石：金屬與巨石，比喻最堅固之物。開：劈開、打通。", "堅持到底、全神貫注，世上就沒有克服不了的難關。"], ["學問成就已經登上百尺竹竿的頂點，還要繼續向前努力邁進、永不止步。", "竿頭：竹竿的頂端。更：更加。進一步：邁向更高境界。", "即使取得了極大的成績，也要保持謙虛，勇於突破自我、精益求精。"], ["有自知之明的人，遇到挫折不會怨恨他人；通曉天理規律的人，不會埋怨上天命運。", "自知：了解自己的能力與不足。知命：懂得事物發展的規律與自然之道。怨：怪罪、抱怨。", "遇事向內探尋原因並提升自己，而不是盲目責怪他人與環境。"], ["品德高尚的君子相處，平淡清徹宛如泉水，長久而真誠；為圖私利的小人交往，甜膩如蜜酒，卻往往難以長久。", "君子：有道德涵養的人。淡：清淡自然。小人：自私圖利之人。醴：甜美甘醇的甜酒。", "真摯純淨的友誼重在靈魂相知，而非利益交換。"], ["外表像金子美玉般華麗奪目，裡面卻只是一堆破爛腐朽的舊棉絮。", "金玉：珍寶美玉。其外：外表。敗絮：破舊腐爛的棉絮。其中：內在。", "告誡我們不要只圖外表光鮮亮麗，充實內在的真才實學與美德才最珍貴。"], ["對待他人要拿出真誠坦白的心，處理事情要專注投入全力以赴，看待競爭的成功或失敗要保持平和淡然的平常心。", "誠心：不欺瞞、真摯。用心：專注細緻。平常心：不被得失榮辱擾亂心情。", "掌握這三顆心，能讓你在人際、學業與生活中行穩致遠、從容自在。"], ["哪怕只是一碗稀粥、一口米飯，都應當想到它們得來絕非容易；哪怕只是半根絲線、半截衣縷，也應當常記物資背後辛勤勞作的艱難。", "當思：應當思索。不易：不簡單。恆念：常常記掛。物力維艱：物品凝聚的辛勞非常艱難。", "懂得珍惜食物、敬畏勞動，是立身處世最重要的美德。"], ["經典好書讀上一百遍也不會令人厭倦，只要反覆精讀並深入思考，其中的微言大義你自然而然就能領悟通曉。", "舊書：經過歲月沉澱的好書、經典。厭：厭倦。深思：深入思考。子：你。自知：自然明白悟懂。", "讀書貴在精讀與思考，而非走馬看花。"], ["一旦走錯了關鍵的一步，就會造成難以挽回的終生遺憾；等想要回頭重新來過時，一生早已虛度過去了。", "失足：腳步踩空跌倒，比喻犯下重大過錯。千古恨：永遠的悔恨。百年身：人的一生。", "提醒我們處事必須審慎清醒，每一步都要走得踏實正直。"], ["工匠想要把手頭的工作做好，必須先磨礪、整備精良鋒利的工具。", "工：工匠。欲：想要。善：完善、做好。利：磨礪鋒利。器：工具器具。", "無論做任何事，事前做好充分的準備與工具學習，才能事半功倍。"], ["自滿自大往往招致損害與挫敗，虛心謙遜才能獲得長足的進益與福祉。", "滿：驕傲自滿。損：虧損傷害。謙：謙虛不居。益：好處與收穫。", "山因卑而增其高，海因下而聚眾流；時刻保持謙遜，才能持續進步。"], ["鳥巢被傾覆打翻了，巢裡面怎麼可能還有完整不碎的鳥蛋呢？", "覆：翻轉傾倒。巢：鳥窩。完：完好無缺。卵：蛋。", "個體與 let LS = [], elems = [], nl = 0;
const poemEl = document.getElementById('poem');
const chapterNav = document.getElementById('chapter-nav');

// 切換 詩詞 / 名言 模組
function switchMode(mode) {
  stopSpeak();
  curMode = mode;
  document.getElementById('tab-poem').classList.toggle('active', mode === 'poem');
  document.getElementById('tab-quote').classList.toggle('active', mode === 'quote');
  document.getElementById('seal-mark').textContent = mode === 'poem' ? '詩' : '言';
  document.getElementById('month-filters').style.display = mode === 'quote' ? 'inline-flex' : 'none';
  setSemesterFilter('all');
  pick(0);
}

// 學期過濾
function setSemesterFilter(sem) {
  curSem = sem;
  document.querySelectorAll('#sem-filters .filter-btn').forEach((b, i) => {
    b.classList.toggle('active', sem === 'all' ? i === 0 : (sem === 0 ? i === 1 : i === 2));
  });
  renderNav();
}

// 學月過濾 (名言專屬)
function setMonthFilter(month) {
  curMonth = month;
  document.querySelectorAll('#month-filters .filter-btn').forEach((b, i) => {
    b.classList.toggle('active', month === 'all' ? i === 0 : (+month === i));
  });
  renderNav();
}

function quoteInfo(idx) {
  const sem = idx < 15 ? 0 : 1;
  const local = idx % 15;
  const month = Math.floor(local / 5) + 1;
  const num = (local % 5) + 1;
  return { sem, month, num };
}

// 生成導覽目錄
function renderNav() {
  chapterNav.innerHTML = '';
  const list = curMode === 'poem' ? P : QUOTES_P;
  list.forEach((item, idx) => {
    if (curMode === 'poem') {
      const sem = idx < 12 ? 0 : 1;
      if (curSem !== 'all' && curSem !== sem) return;
    } else {
      const q = quoteInfo(idx);
      if (curSem !== 'all' && curSem !== q.sem) return;
      if (curMonth !== 'all' && curMonth !== q.month) return;
    }
    const btn = document.createElement('button');
    btn.className = 'chap-btn' + (idx === cur ? ' active' : '');
    const num = curMode === 'poem' ? (idx % 12 + 1) : `${quoteInfo(idx).month}月(${quoteInfo(idx).num})`;
    btn.textContent = `${num}. ${item[0]}`;
    btn.onclick = () => pick(idx);
    chapterNav.appendChild(btn);
  });
}

// 挑選並載入某首 (詩/名句)
function pick(idx) {
  stopSpeak();
  const list = curMode === 'poem' ? P : QUOTES_P;
  cur = (idx + list.length) % list.length;
  t0 = null;
  
  // 更新導覽高亮
  document.querySelectorAll('.chap-btn').forEach((b, k) => {
    b.classList.toggle('active', b.textContent.includes(list[cur][0]));
  });

  // 渲染右側直排書法文字 (徹底純淨，無注音，保證全詩完整呈現)
  const item = list[cur];
  let poemHtml = `<h2>${item[0]}</h2><small>${item[1]}</small>`;
  
  if (curMode === 'poem') {
    const sents = item[2].match(/[^，。；？！]+[，。；？！]/g) || [item[2]];
    poemHtml += sents.map((s, k) => `<p data-idx="${k}">${s}</p>`).join('');
  } else {
    // 名言佳句
    poemHtml += `<p data-idx="0">${item[2]}</p>`;
  }

  poemEl.innerHTML = poemHtml;

  // 場景組件準備
  setup();
  renderEx();
  
  if (window._started && document.getElementById('au').checked) {
    setTimeout(speak, 250);
  }
}

function setup() {
  const ps = [...poemEl.querySelectorAll('p')];
  nl = ps.length;
  LS = ps.map((_, k) => 1 + k * 3.5);
  const list = curMode === 'poem' ? P : QUOTES_P;
  const mList = curMode === 'poem' ? M : QUOTES_M;
  const xList = curMode === 'poem' ? (X[cur] || []) : [];
  
  elems = [...list[cur][4], ...xList].map((e, i) => ({
    e,
    l: Math.min(+(mList[cur] && mList[cur][i]) || 0, nl - 1)
  }));

  ps.forEach((e, k) => {
    e.onclick = () => {
      unlockAudio();
      playSentence(k);
    };
  });
}

// 格式化小小字詞：每個字詞獨立分行
function formatVocab(str) {
  if (!str) return '';
  const parts = str.split(/。/).map(s => s.trim()).filter(Boolean);
  return parts.map(p => {
    const m = p.match(/^([^：:]+)[：:](.+)$/);
    if (m) {
      return `<div class="vocab-row"><span class="vocab-word">${m[1]}</span><span class="vocab-colon">：</span><span class="vocab-meaning">${m[2]}。</span></div>`;
    }
    return `<div class="vocab-row">${p}。</div>`;
  }).join('');
}

// 渲染賞析解說
function renderEx() {
  const ex = curMode === 'poem' ? EX[cur] : QUOTES_EX[cur];
  const b = document.getElementById('ex-body');
  if (!ex || !b) return;
  b.innerHTML = `
    <div class="ex-card"><div class="ex-card-title">🗣 白話說一說</div>${ex[0]}</div>
    <div class="ex-card"><div class="ex-card-title">🔤 小小字詞／典故出處</div><div class="vocab-list">${formatVocab(ex[1])}</div></div>
    <div class="ex-card"><div class="ex-card-title">⭐ 生活領悟／記住這句</div>${ex[2]}</div>
  `;
}

let playKey = null, playMode = null, playEndAt = Infinity;

voiceHint();
try {
  fetch('timings.json').then(r => r.json()).then(j => {
    if (j) TIM = j;
    voiceHint();
  }).catch(() => {});
} catch (e) {}

function voiceHint() {
  const el = document.getElementById('vn');
  if (!el) return;
  if (TIM) {
    el.textContent = '語音：曉曉高音質美聲 (女聲) ｜ 智能逐句跟讀 ｜ 側邊靜音撥桿需關閉';
  } else {
    el.textContent = (voice ? '語音：' + voice.name : 'Web Speech API 即時語音') + ' ｜ 側邊靜音撥桿需關閉';
  }
}

function findVoice() {
  if (!SS) return;
  const v = SS.getVoices() || [];
  voice = v.find(x => /zh[-_]TW/i.test(x.lang)) || v.find(x => /^zh/i.test(x.lang)) || null;
  voiceHint();
}
if (SS) {
  findVoice();
  if (SS.onvoiceschanged !== undefined) SS.onvoiceschanged = findVoice;
}

// 停止朗讀 (同時解除跟讀狀態，全詩完整呈現)
function stopSpeak() {
  isReadingMode = false;
  poemEl.classList.remove('reading-mode');
  document.querySelectorAll('#poem p').forEach(p => {
    p.classList.remove('active', 'read-revealed');
  });
  exStop();
  sid++;
  playMode = null;
  try { AU_READ.pause(); } catch (e) {}
  try { AU_EX.pause(); } catch (e) {}
  if (SS) { try { SS.cancel(); } catch (e) {} }
}

function getTim(mode, idx) {
  if (!TIM) return null;
  if (mode === 'poem') {
    if (TIM.poems) return TIM.poems[idx] || null;
    if (Array.isArray(TIM)) return TIM[idx] || null;
    return null;
  } else {
    if (TIM.quotes) return TIM.quotes[idx] || null;
    return null;
  }
}

function applyRate() {
  const r = +document.getElementById('rt').value / 0.8;
  try { AU_READ.playbackRate = r; AU_EX.playbackRate = r; } catch (e) {}
}
document.getElementById('rt').addEventListener('change', applyRate);

// 定時追蹤音訊時間軸並點亮詩句／名言
setInterval(() => {
  if (!playMode) return;
  const au = playMode.startsWith('ex') ? AU_EX : AU_READ;
  if (au.paused) return;
  const t = au.currentTime;
  if (t >= playEndAt) {
    stopSpeak();
    return;
  }
  const tp = getTim(curMode, cur);
  if (!tp) return;
  if (playMode === 'readFull' || playMode === 'single') {
    const en = tp.read;
    for (let k = 1; k < en.length; k++) {
      if (t >= en[k].start && t < en[k].end) {
        paintRead(k - 1);
        break;
      }
    }
  } else if (playMode === 'exFull') {
    const en = tp.explain;
    for (let k = 0; k < en.length; k++) {
      if (t >= en[k].start && t < en[k].end) {
        paintEx(k);
        break;
      }
    }
  }
}, 80);

// 渲染跟讀動效：讀到的句子墨染浮現，未讀的句子隱藏，讀過的句子保持顯現
function paintRead(sentIdx) {
  const ps = [...poemEl.querySelectorAll('p')];
  ps.forEach((p, i) => {
    if (isReadingMode) {
      if (i <= sentIdx) {
        p.classList.add('read-revealed');
      } else {
        p.classList.remove('read-revealed');
      }
    }
    p.classList.toggle('active', i === sentIdx);
    if (i === sentIdx && (LS[i] === Infinity || T - LS[i] > 20)) {
      LS[i] = T;
    }
  });
}

function paintEx(idx) {
  const cards = document.querySelectorAll('#ex-body .ex-card');
  cards.forEach((c, i) => {
    c.style.background = i === idx ? 'rgba(176,48,38,0.18)' : '';
  });
}

// 開始朗讀
function speak() {
  unlockAudio();
  stopSpeak();
  applyRate();
  
  // 開啟跟讀模式
  isReadingMode = true;
  poemEl.classList.add('reading-mode');
  poemEl.querySelectorAll('p').forEach(p => p.classList.remove('read-revealed', 'active'));

  const tp = getTim(curMode, cur);
  if (tp && tp.files && tp.files.read) {
    AU_READ.src = tp.files.read;
    AU_READ.currentTime = 0;
    playMode = 'readFull';
    playEndAt = tp.read_total + 0.3;
    AU_READ.play().catch(e => speakLegacy());
  } else {
    speakLegacy();
  }
}

function speakLegacy() {
  if (!SS) return;
  const my = sid;
  const ps = [...poemEl.querySelectorAll('p')];
  const list = curMode === 'poem' ? P : QUOTES_P;
  const item = list[cur];
  const rate = +document.getElementById('rt').value;
  
  const textLines = ps.map(p => p.textContent);
  const lines = [item[0] + '。' + item[1], ...textLines];
  
  let step = 0;
  function nextStep() {
    if (my !== sid || step >= lines.length) return;
    const u = new SpeechSynthesisUtterance(lines[step]);
    u.rate = step ? rate * .9 : rate;
    u.lang = 'zh-TW';
    if (voice) u.voice = voice;
    
    u.onstart = () => {
      if (my !== sid) return;
      if (step > 0) {
        paintRead(step - 1);
      }
    };
    u.onend = () => {
      if (my !== sid) return;
      step++;
      if (step < lines.length) nextStep();
      else stopSpeak();
    };
    u.onerror = () => {
      step++;
      if (step < lines.length) nextStep();
    };
    SS.speak(u);
  }
  nextStep();
}

function playSentence(k) {
  unlockAudio();
  stopSpeak();
  applyRate();
  const ps = [...poemEl.querySelectorAll('p')];
  ps.forEach((p, idx) => p.classList.toggle('active', idx === k));
  if (LS[k] === Infinity || T - LS[k] > 20) LS[k] = T;
  
  const tp = getTim(curMode, cur);
  if (tp && tp.read && tp.read[k + 1]) {
    const en = tp.read[k + 1];
    AU_READ.src = tp.files.read;
    AU_READ.currentTime = Math.max(0, en.start + 0.02);
    playMode = 'single';
    playEndAt = en.end;
    AU_READ.play().catch(e => legacySingleSentence(k));
  } else {
    legacySingleSentence(k);
  }
}

function legacySingleSentence(k) {
  const ps = [...poemEl.querySelectorAll('p')];
  if (!SS || !ps[k]) return;
  const lineText = ps[k].textContent;
  const u = new SpeechSynthesisUtterance(lineText);
  u.lang = 'zh-TW';
  if (voice) u.voice = voice;
  u.rate = +document.getElementById('rt').value * .9;
  SS.speak(u);
}

// 賞析解說語音
let exOn = false;
function exStop() {
  exOn = false;
  const b = document.getElementById('exs');
  if (b) b.textContent = '🔊 聽解說';
  document.querySelectorAll('#ex-body .ex-card').forEach(c => c.style.background = '');
}

function speakEx() {
  unlockAudio();
  if (exOn) { stopSpeak(); return; }
  exOn = true;
  const b = document.getElementById('exs');
  if (b) b.textContent = '⏹ 停止解說';
  applyRate();
  const tp = getTim(curMode, cur);
  if (tp && tp.files && tp.files.explain) {
    AU_EX.src = tp.files.explain;
    AU_EX.currentTime = 0;
    playMode = 'exFull';
    playEndAt = tp.explain_total + 0.3;
    AU_EX.play().catch(e => speakExLegacy());
  } else {
    speakExLegacy();
  }
}

function speakExLegacy() {
  const ex = curMode === 'poem' ? EX[cur] : QUOTES_EX[cur];
  if (!ex || !SS) return;
  const text = ex[0] + '。' + ex[1] + '。' + ex[2];
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW';
  if (voice) u.voice = voice;
  u.rate = +document.getElementById('rt').value * .92;
  u.onend = () => exStop();
  u.onerror = () => exStop();
  SS.speak(u);
}

// 播畢自動停止，恢復全詩完整顯現
AU_READ.onended = () => stopSpeak();
AU_EX.onended = () => stopSpeak();
document.getElementById('exs').onclick = speakEx;

// 按鈕事件綁定
document.getElementById('pr').onclick = () => pick(cur - 1);
document.getElementById('nx').onclick = () => pick(cur + 1);
document.getElementById('rp').onclick = () => pick(cur);
document.getElementById('sp').onclick = speak;
document.getElementById('ss').onclick = stopSpeak;
document.getElementById('exb').onclick = () => {
  const d = document.getElementById('ex');
  const on = d.classList.toggle('on');
  document.getElementById('exb').classList.toggle('active', on);
};
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') pick(cur - 1);
  if (e.key === 'ArrowRight') pick(cur + 1);
});

// 啟動程序
renderNav();
pick(0);
window._started = true;
requestAnimationFrame(frame);
