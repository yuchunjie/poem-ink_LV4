const EX=[["賀知章年輕時就離開了家鄉，到很老才回來。他說話還是老家的口音，耳邊的頭髮卻變得稀疏了。村裡的小孩看到他，都不認識，還笑著問：「客人，您從哪裡來呀？」", "鄉音：家鄉的口音。鬢毛：耳朵旁邊的頭髮。", "回到家鄉，家鄉的人卻把他當成客人，心裡又高興又心酸。"], ["月亮落下去了，烏鴉在樹上啼叫，天空好像飄著霜。江邊的楓樹和漁船的燈火，陪著睡不著的我。蘇州城外的寒山寺，半夜的鐘聲傳到了我的船上。", "夜泊：晚上把船停在岸邊。江楓：江邊的楓樹。", "旅途中的夜晚好安靜，鐘聲讓心裡的愁更深了。"], ["秋天的夜裡，銀白的蠟燭照著畫屏，光看起來冷冷的。宮女拿著小扇子，撲打飛來飛去的螢火蟲。夜色涼得像水，她躺在石階上，望著天上的牽牛星和織女星。", "銀燭：銀白色的蠟燭。輕羅小扇：用薄絲做的小圓扇。", "宮女好寂寞，只能看著星星想心事。"], ["我一個人住在別的地方，每到節日就更想念家人。我知道哥哥弟弟們正在爬高山，大家頭上都插著茱萸，卻少了我一個人。", "倍：更加。茱萸：一種有香氣的植物，重陽節那天，人們會帶著它登高。", "家人團聚時少了自己，思念就更深了。"], ["少年很容易變老，學問卻很難學成，所以連一寸的時間都不能隨便浪費。池塘邊的春草夢還沒醒，台階前的梧桐葉已經沙沙作響，秋天又到了。", "輕：看輕。春草夢：春天的美夢。", "時間過得很快，要趁年輕好好讀書。"], ["老朋友在黃鶴樓向我告別，在花開得像煙霧的三月，坐船往揚州去。那一片孤單的帆影越走越遠，消失在藍天的盡頭，只剩長江的水一直流向天邊。", "故人：老朋友。煙花：形容春天的花開得像一片煙霧。惟：只。", "李白一直望著船走遠，捨不得朋友離開。"], ["月亮和關口還是秦漢時代的樣子，可是去很遠的地方打仗的人，還沒有回來。要是名將李廣還在，就不會讓胡人的兵馬越過陰山。", "塞：邊境上重要的地方。還：回來。不教：不讓。度：越過。", "作者想念出征的士兵，也希望有好將軍保護國家。"], ["我勸你不要太愛惜華麗的衣服，要好好珍惜年輕的時光。花開得正美，就該摘下來，不要等到花謝了，才空著手去折枯枝。", "金縷衣：繡著金線的漂亮衣服。直須：儘管，不要猶豫。莫待：不要等到。", "時間不會等人，要趁現在把握好時光。"], ["半畝大的方形池塘，像一面打開的鏡子，天光和雲的影子在水裡來回移動。為什麼池水這麼清澈？因為源頭有活水不停流進來。", "方塘：一方水池。鑑：鏡子。", "常常學新東西，心裡才會像池水一樣清清亮亮。"], ["用葡萄釀的好酒，倒進夜光杯裡。正想喝的時候，琵琶聲響起，催大家出發了。就算醉倒在沙場上，請你別笑我。從古到今，打仗的人有幾個能平安回家呢？", "夜光杯：用白玉做的酒杯。催：催促。沙場：戰場。", "士兵一邊喝酒，一邊想著打仗的辛苦，有點無奈，也有點豪氣。"], ["遠遠看到一座高橋，被山野間的煙霧遮住了。我在河邊的石堆旁，向漁船上的人問路。桃花整天跟著流水漂走，桃花源的洞口，到底在清澈溪水的哪一邊呢？", "飛橋：很高的橋。石磯：河裡露出水面的石堆。", "作者想找到像仙境一樣的桃花源。"], ["慈祥的媽媽拿著針線，為要遠行的孩子縫衣服。她縫得又密又緊，是怕孩子很晚才回家。誰說小小的草心，報答得了春天陽光般的恩情呢？", "遊子：離開家鄉的人。三春暉：春天溫暖的陽光，比喻媽媽的愛。", "媽媽的愛藏在一針一線裡，我們一輩子也報答不完。"], ["天上的鳥兒都飛遠了，孤單的白雲也慢慢飄走。我望著山，山也望著我，我們誰都不嫌棄誰。這時陪著我的，只有敬亭山。", "盡：消失。閒：安靜。厭：厭倦。", "李白很孤單，所以把山當成了好朋友。"], ["從正面看，廬山是一排山嶺，從側面看，就變成高高的山峰。從遠、近、高、低不同的地方看，樣子都不一樣。我們看不清廬山的真面目，因為自己就在山裡面。", "題壁：把字寫在牆上。緣：因為。峰：山的尖頂。", "換個角度看事情，才能看得更清楚。"], ["黃河好像從遠方一直通到白雲裡，一座孤零零的城蓋在高山上。羌笛不用吹出哀怨的〈楊柳〉曲子，因為春風根本吹不到玉門關外。", "孤城：指玉門關。羌笛：羌族人的短笛。何須：何必。", "邊境的士兵離家很遠，春天好像也到不了那裡。"], ["我偶然走到松樹下，就枕著石頭睡著了。山裡沒有日曆，冬天過去了，我也不知道現在是哪一年。", "偶：偶然。高枕：安心地睡覺。曆日：記載日子和節氣的書。", "在山裡過著自由安靜的日子，連時間都忘了。"], ["美麗的女子捲起了珠簾，久久坐著，皺著眉頭。只看見她臉上的淚痕濕了一大片，不知道她心裡在怨誰。", "蹙蛾眉：皺起眉頭。深坐：久久呆坐。", "她很傷心，卻不說出口，讓人心疼。"], ["心裡很有感情，看起來卻好像沒有感情，因為太難過，連笑都笑不出來。桌上的蠟燭好像也捨不得分別，一滴一滴流下蠟油，替我們流淚到天亮。", "唯覺：只覺得。笑不成：想笑卻笑不出來。還惜別：也捨不得分開。", "太捨不得朋友，難過得說不出話。"], ["李白和杜甫的詩傳了很久，現在讀起來已經不覺得新鮮。每個朝代都會出現有才華的人，各自領導風潮好幾百年。", "李杜：李白和杜甫。江山：國家。", "寫作要有自己的新想法，不要只照著前人做。"], ["清明節的時候，細雨一直下，路上的行人心情很煩悶。我向牧童請問哪裡有酒店可以休息，牧童用手指著遠處的杏花村。", "紛紛：很多。欲斷魂：難過得好像靈魂要離開身體。借問：請問。", "淋著雨的旅人，因為牧童的指路，心裡有了方向。"], ["你問我什麼時候回去，我還不知道。巴山的夜晚正下著雨，雨水漲滿了秋天的池塘。什麼時候才能和你坐在西窗下一起剪燭花，說說今晚巴山夜雨的情景呢？", "何當：什麼時候才能。剪燭：把燒焦的燭芯剪掉，燭光才會亮。卻話：回頭再說。", "作者很想念親人，盼望能早點團聚。"], ["我在花叢中拿著一壺酒，一個人喝，沒有人陪。我舉起杯子邀請明月，再加上月光照出來的影子，就像三個人一起喝酒。", "獨酌：一個人喝酒。無相親：沒有親近的人。", "李白很孤單，所以想像月亮和影子是他的朋友。"], ["江上飄著細細的雨，岸邊的草長得很整齊。六朝的繁華像夢一樣過去了，只剩鳥兒空空地叫。最無情的是臺城的柳樹，還是像煙霧一樣罩著十里長堤。", "霏霏：細雨飄飛的樣子。六朝：金陵過去的六個朝代。臺城：六朝時的皇宮。", "人間的繁華會消失，大自然卻一直都在。"], ["半夜三更就點燈讀書，到天快亮、公雞啼叫的時候，正是男孩子讀書最好的時間。年輕時不知道要早點用功，等頭髮白了，才後悔沒有多讀書，已經太晚了。", "三更：半夜。五更：天快亮的時候。黑髮：年輕人。白首：老人。", "讀書要趁早，不要等老了才後悔。"]];
function renderEx(){const e=EX[cur],d=document.getElementById('ex');if(!e||!d)return;d.innerHTML='<p style="margin:0 0 8px"><button id="exs">🔊 聽解說</button></p><p class="s"><b>🗣 白話說一說</b><br>'+e[0]+'</p><p class="s"><b>🔤 小小字詞</b><br>'+e[1]+'</p><p class="s" style="margin:0"><b>⭐ 記住這句</b><br>'+e[2]+'</p>'}
let exOn=false;
function exStop(){exOn=false;const b=document.getElementById('exs');if(b)b.textContent='🔊 聽解說';document.querySelectorAll('#ex p.s').forEach(e=>e.style.background='')}
function speakEx(){if(!SS)return;if(exOn){stopSpeak();return}stopSpeak();const my=sid,rate=+document.getElementById('rt').value,ps=[...document.querySelectorAll('#ex p.s')],e=EX[cur],tx=[e[0],'詩裡有幾個詞，我們先來認識一下。'+e[1].split('。').filter(Boolean).map(w=>{const[a,...r]=w.split('：');return '「'+a+'」的意思是'+r.join('：')+'。'}).join(''),'簡單來說，'+e[2]];exOn=true;document.getElementById('exs').textContent='⏹ 停止解說';window._U=[];
tx.forEach((t,k)=>{const u=new SpeechSynthesisUtterance(t);window._U.push(u);u.lang=voice?voice.lang:'zh-TW';if(voice)u.voice=voice;u.rate=rate*.95;u.pitch=1.05;u.onstart=()=>{if(my==sid)ps.forEach((x,i)=>x.style.background=i==k?'rgba(176,48,38,.15)':'')};u.onend=u.onerror=()=>{if(my==sid&&k==tx.length-1)exStop()};SS.speak(u)});
setTimeout(()=>{if(my==sid)exStop()},(tx.join('').length/(4*rate*.9)+3)*1300)}
document.getElementById('ex').addEventListener('click',ev=>{if(ev.target.id=='exs')speakEx()});
document.getElementById('exb').onclick=()=>{const d=document.getElementById('ex'),on=d.classList.toggle('on');document.getElementById('exb').classList.toggle('on',on)};
