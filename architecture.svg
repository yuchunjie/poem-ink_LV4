<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc" viewBox="0 0 980 600" width="980" height="600">
  <title id="arch-title">我愛讀詩・水墨雅集 LV4 系統架構圖</title>
  <desc id="arch-desc">展示前端展示層、雙軌語音時序同步核心以及雙軌生動畫卷繪製引擎的資料流與協同關係。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Noto Serif TC", "Songti TC", SimSun, "PingFang TC", "Microsoft JhengHei", serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .focal-glow { filter: drop-shadow(0 2px 8px rgba(176, 48, 38, 0.18)); }
      .zone-border { stroke-dasharray: 6 3; }
    </style>
    <!-- Arrow Markers -->
    <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a4844"/>
    </marker>
    <marker id="arrow-cinnabar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b03026"/>
    </marker>
    <marker id="arrow-celadon" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a706e"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b39b64"/>
    </marker>

    <!-- Linear Gradients for Rice Paper & Seals -->
    <linearGradient id="bgRiceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="50%" stop-color="#fff9ee"/>
      <stop offset="100%" stop-color="#f6efe1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdfbf5"/>
    </linearGradient>
    <linearGradient id="focalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6f4"/>
      <stop offset="100%" stop-color="#feedeb"/>
    </linearGradient>
    <linearGradient id="celadonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f7f7"/>
      <stop offset="100%" stop-color="#e3eeee"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgRiceGrad)"/>

  <!-- Outer Traditional Framing Border with Corner Seals -->
  <rect x="16" y="16" width="948" height="568" rx="8" fill="none" stroke="#dcd3c1" stroke-width="1.2"/>
  <rect x="20" y="20" width="940" height="560" rx="6" fill="none" stroke="#ebe4d6" stroke-width="0.8"/>

  <!-- Corner Seal Accents -->
  <path d="M 28 40 L 28 28 L 40 28" fill="none" stroke="#b03026" stroke-width="2"/>
  <path d="M 952 40 L 952 28 L 940 28" fill="none" stroke="#b03026" stroke-width="2"/>
  <path d="M 28 560 L 28 572 L 40 572" fill="none" stroke="#b03026" stroke-width="2"/>
  <path d="M 952 560 L 952 572 L 940 572" fill="none" stroke="#b03026" stroke-width="2"/>

  <!-- HEADER AREA -->
  <g id="header-group" transform="translate(36, 30)">
    <!-- Small Cinnabar Title Seal -->
    <rect x="0" y="4" width="22" height="22" rx="3" fill="#b03026"/>
    <text x="11" y="20" fill="#fff9ee" font-size="13" font-weight="700" text-anchor="middle">雅</text>

    <!-- Main Title & Subtitle -->
    <text x="32" y="16" fill="#1f2022" font-size="18" font-weight="700" letter-spacing="0.06em">我愛讀詩・水墨雅集 LV4 系統架構圖</text>
    <text x="32" y="32" fill="#76746f" font-size="11" class="mono">SCHOLAR INK ARCHITECTURE PORTAL ｜ 零外部依賴・雙軌時序跟讀・生動畫卷遮罩引擎</text>

    <!-- Version & Metric Badges -->
    <g transform="translate(640, 4)">
      <rect x="0" y="0" width="70" height="20" rx="4" fill="#b03026" fill-opacity="0.1" stroke="#b03026" stroke-width="0.8"/>
      <text x="35" y="14" fill="#b03026" font-size="10" font-weight="600" text-anchor="middle">54 篇經典</text>

      <rect x="76" y="0" width="84" height="20" rx="4" fill="#4a706e" fill-opacity="0.12" stroke="#4a706e" stroke-width="0.8"/>
      <text x="118" y="14" fill="#4a706e" font-size="10" font-weight="600" text-anchor="middle">108 路離線語音</text>

      <rect x="166" y="0" width="94" height="20" rx="4" fill="#b39b64" fill-opacity="0.15" stroke="#b39b64" stroke-width="0.8"/>
      <text x="213" y="14" fill="#887340" font-size="10" font-weight="600" text-anchor="middle">63 組水墨圖元</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- ZONE 1: 展示與自適應交互層 (INTERACTION TIER) -->
  <!-- ========================================== -->
  <g id="zone-1" transform="translate(32, 78)">
    <rect x="0" y="0" width="272" height="434" rx="8" fill="#ffffff" fill-opacity="0.45" stroke="#dcd3c1" stroke-width="0.9" class="zone-border"/>
    
    <!-- Zone Tag -->
    <rect x="12" y="-10" width="138" height="20" rx="3" fill="#f6efe1" stroke="#c8beac" stroke-width="0.8"/>
    <text x="81" y="4" fill="#65625c" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.08em">展示與自適應交互層</text>

    <!-- Node 1: Vertical Calligraphy View -->
    <g id="node-calligraphy" transform="translate(16, 22)">
      <rect x="0" y="0" width="240" height="74" rx="6" fill="url(#cardGrad)" stroke="#c8beac" stroke-width="1"/>
      <rect x="8" y="8" width="28" height="15" rx="2" fill="#76746f" fill-opacity="0.12"/>
      <text x="22" y="19" fill="#4a4844" font-size="8" font-weight="600" text-anchor="middle">VIEW</text>
      <text x="44" y="20" fill="#1f2022" font-size="12" font-weight="700">直排書法雅集展示</text>
      <text x="8" y="40" fill="#65625c" font-size="10">古籍直行書寫流 (writing-mode: vertical-rl)</text>
      <text x="8" y="56" fill="#88847c" font-size="9" class="mono">逐句墨化高亮 ｜ 點擊單句即選即讀</text>
    </g>

    <!-- Node 2: Ambient Controls & Drawer -->
    <g id="node-controls" transform="translate(16, 114)">
      <rect x="0" y="0" width="240" height="88" rx="6" fill="url(#cardGrad)" stroke="#c8beac" stroke-width="1"/>
      <rect x="8" y="8" width="22" height="15" rx="2" fill="#b03026" fill-opacity="0.12"/>
      <text x="19" y="19" fill="#b03026" font-size="8" font-weight="600" text-anchor="middle">UI</text>
      <text x="38" y="20" fill="#1f2022" font-size="12" font-weight="700">水墨控制台與抽屜導覽</text>
      <text x="8" y="42" fill="#65625c" font-size="10">唐詩 24 首 ｜ 名言佳句 30 則即時切換</text>
      <text x="8" y="58" fill="#65625c" font-size="10">語速微調 0.6x~1.4x ｜ 自動朗讀撥桿</text>
      <text x="8" y="74" fill="#88847c" font-size="9" class="mono">手機平板底部抽屜 (Bottom Sheet Drawer)</text>
    </g>

    <!-- Node 3: Commentary Glass Modal -->
    <g id="node-commentary" transform="translate(16, 220)">
      <rect x="0" y="0" width="240" height="86" rx="6" fill="url(#cardGrad)" stroke="#c8beac" stroke-width="1"/>
      <rect x="8" y="8" width="36" height="15" rx="2" fill="#4a706e" fill-opacity="0.15"/>
      <text x="26" y="19" fill="#4a706e" font-size="8" font-weight="600" text-anchor="middle">PANEL</text>
      <text x="50" y="20" fill="#1f2022" font-size="12" font-weight="700">詩意賞析與解說抽屜</text>
      <text x="8" y="42" fill="#65625c" font-size="10">🗣 白話說一說 (白話意境解析)</text>
      <text x="8" y="58" fill="#65625c" font-size="10">🔤 小小字詞／典故 ｜ ⭐ 生活領悟</text>
      <text x="8" y="74" fill="#88847c" font-size="9" class="mono">獨立語音講解連動 ｜ 句句卡片跟讀</text>
    </g>

    <!-- Node 4: Responsive Layout Core -->
    <g id="node-rwd" transform="translate(16, 324)">
      <rect x="0" y="0" width="240" height="88" rx="6" fill="url(#cardGrad)" stroke="#c8beac" stroke-width="1"/>
      <rect x="8" y="8" width="30" height="15" rx="2" fill="#b39b64" fill-opacity="0.18"/>
      <text x="23" y="19" fill="#887340" font-size="8" font-weight="600" text-anchor="middle">RWD</text>
      <text x="46" y="20" fill="#1f2022" font-size="12" font-weight="700">多端自適應渲染引擎</text>
      <text x="8" y="42" fill="#65625c" font-size="10">桌面端：三欄手卷雅集 (書卷+畫卷+解說)</text>
      <text x="8" y="58" fill="#65625c" font-size="10">移動端：Ambient Glass 滿版水墨底圖</text>
      <text x="8" y="74" fill="#88847c" font-size="9" class="mono">宣紙靜態仿磨砂 ｜ 嚴控 60FPS 零掉幀</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- ZONE 2: 雙軌語音時序同步核心 (AUDIO & TIMING CORE) -->
  <!-- ========================================== -->
  <g id="zone-2" transform="translate(328, 78)">
    <rect x="0" y="0" width="288" height="434" rx="8" fill="#ffffff" fill-opacity="0.45" stroke="#dcd3c1" stroke-width="0.9" class="zone-border"/>
    
    <!-- Zone Tag -->
    <rect x="12" y="-10" width="168" height="20" rx="3" fill="#feedeb" stroke="#eecbc7" stroke-width="0.8"/>
    <text x="96" y="4" fill="#b03026" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.08em">雙軌語音時序同步核心</text>

    <!-- Node 5: Dual-Track Audio Engine (Focal 1) -->
    <g id="node-sync-core" transform="translate(16, 22)" class="focal-glow">
      <rect x="0" y="0" width="256" height="112" rx="6" fill="url(#focalGrad)" stroke="#b03026" stroke-width="1.3"/>
      <!-- Core Badge -->
      <rect x="8" y="8" width="46" height="16" rx="2" fill="#b03026"/>
      <text x="31" y="19" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle">PRIMARY</text>
      <text x="62" y="20" fill="#b03026" font-size="13" font-weight="700">108 路曉曉離線高音質語音庫</text>
      <text x="8" y="44" fill="#4a4844" font-size="10">微軟曉曉神經網絡擬真音質 (純離線 MP3)</text>
      <text x="8" y="60" fill="#4a4844" font-size="10">24唐詩 (48首) + 30名言 (60首) 朗讀與詳解</text>
      <text x="8" y="78" fill="#65625c" font-size="9" class="mono">毫秒級時間戳索引 (timings.json 內建嵌入)</text>
      <text x="8" y="96" fill="#b03026" font-size="9" font-weight="600" class="mono">80ms 定時器追蹤 ｜ 逐句事件精確派發</text>
    </g>

    <!-- Node 6: 4-Stage State Synchronizer (Focal 2) -->
    <g id="node-reading-state" transform="translate(16, 152)">
      <rect x="0" y="0" width="256" height="112" rx="6" fill="url(#cardGrad)" stroke="#b03026" stroke-width="1"/>
      <rect x="8" y="8" width="44" height="15" rx="2" fill="#b03026" fill-opacity="0.12"/>
      <text x="30" y="19" fill="#b03026" font-size="8" font-weight="600" text-anchor="middle">STATE</text>
      <text x="58" y="20" fill="#1f2022" font-size="12" font-weight="700">逐句跟讀狀態機 (isReadingMode)</text>
      <text x="8" y="42" fill="#4a4844" font-size="10" font-weight="600">【鐵則】畫面嚴格依唸到的句子逐句浮現</text>
      <text x="8" y="60" fill="#65625c" font-size="10">當前句 sentIdx 觸發當層水墨擴散遮罩</text>
      <text x="8" y="78" fill="#65625c" font-size="10">未讀句子保持隱藏 ｜ 讀畢全景完整鋪展</text>
      <text x="8" y="96" fill="#88847c" font-size="9" class="mono">停頓與播放結束自動解除遮罩展示全畫</text>
    </g>

    <!-- Node 7: Web Speech API Fallback Watchdog -->
    <g id="node-speech-fallback" transform="translate(16, 282)">
      <rect x="0" y="0" width="256" height="130" rx="6" fill="url(#cardGrad)" stroke="#c8beac" stroke-width="1"/>
      <rect x="8" y="8" width="54" height="15" rx="2" fill="#76746f" fill-opacity="0.12"/>
      <text x="35" y="19" fill="#4a4844" font-size="8" font-weight="600" text-anchor="middle">FALLBACK</text>
      <text x="68" y="20" fill="#1f2022" font-size="12" font-weight="700">Web Speech API 智能容錯機</text>
      <text x="8" y="44" fill="#65625c" font-size="10">離線音檔缺失或瀏覽器受限時自動降級</text>
      <text x="8" y="60" fill="#65625c" font-size="10">自動檢索 zh-TW / zh 繁體中文系統語音</text>
      <text x="8" y="78" fill="#65625c" font-size="10">Watchdog 防吞噬機制：斷觸與延遲自動補位</text>
      <text x="8" y="96" fill="#88847c" font-size="9" class="mono">全域解鎖 (touch/pointerup/click 多重監聽)</text>
      <text x="8" y="114" fill="#887340" font-size="9" class="mono">AudioContext.resume() 喚醒 iOS 靜音通道</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- ZONE 3: 雙軌生動畫卷繪製引擎 (GRAPHICS & MASKING) -->
  <!-- ========================================== -->
  <g id="zone-3" transform="translate(640, 78)">
    <rect x="0" y="0" width="308" height="434" rx="8" fill="#ffffff" fill-opacity="0.45" stroke="#dcd3c1" stroke-width="0.9" class="zone-border"/>
    
    <!-- Zone Tag -->
    <rect x="12" y="-10" width="162" height="20" rx="3" fill="#eef3f3" stroke="#cadada" stroke-width="0.8"/>
    <text x="93" y="4" fill="#4a706e" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.08em">雙軌生動畫卷繪製引擎</text>

    <!-- Node 8: 54 Unique Masterwork Scenes (Pilot 4) -->
    <g id="node-masterwork" transform="translate(16, 22)">
      <rect x="0" y="0" width="276" height="84" rx="6" fill="url(#celadonGrad)" stroke="#4a706e" stroke-width="1.1"/>
      <rect x="8" y="8" width="48" height="15" rx="2" fill="#4a706e"/>
      <text x="32" y="19" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle">STITCH AI</text>
      <text x="62" y="20" fill="#1f2022" font-size="12" font-weight="700">54 首專屬無重複意境畫卷</text>
      <text x="8" y="42" fill="#4a4844" font-size="10">回鄉偶書 ｜ 楓橋夜泊 ｜ 秋夕 ｜ 憶山東兄弟</text>
      <text x="8" y="58" fill="#65625c" font-size="10">徹底淘汰重複方舟山巒，全篇專屬構圖</text>
      <text x="8" y="74" fill="#4a706e" font-size="9" class="mono">宋代生宣古法設色 (Modern Song Palette)</text>
    </g>

    <!-- Node 9: 4-Stage Ink Wash Masking -->
    <g id="node-masking" transform="translate(16, 114)" class="focal-glow">
      <rect x="0" y="0" width="276" height="88" rx="6" fill="url(#focalGrad)" stroke="#b03026" stroke-width="1.2"/>
      <rect x="8" y="8" width="38" height="15" rx="2" fill="#b03026"/>
      <text x="27" y="19" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle">MASK</text>
      <text x="52" y="20" fill="#b03026" font-size="12" font-weight="700">四階段水墨擴散遮罩 (4-Stage Mask)</text>
      <text x="8" y="42" fill="#4a4844" font-size="10">Stage 1 遠景天幕 ➔ Stage 2 中景江流樹木</text>
      <text x="8" y="58" fill="#4a4844" font-size="10">Stage 3 近景人物樓閣 ➔ Stage 4 點睛動態粒子</text>
      <text x="8" y="76" fill="#b03026" font-size="9" class="mono">淡墨暈染擴散演算法 (Radial Ink Diffusion)</text>
    </g>

    <!-- Node 10: 63 Procedural Ink Primitives -->
    <g id="node-primitives" transform="translate(16, 210)">
      <rect x="0" y="0" width="276" height="92" rx="6" fill="url(#cardGrad)" stroke="#c8beac" stroke-width="1"/>
      <rect x="8" y="8" width="46" height="15" rx="2" fill="#b39b64" fill-opacity="0.2"/>
      <text x="31" y="19" fill="#887340" font-size="8" font-weight="600" text-anchor="middle">CANVAS</text>
      <text x="60" y="20" fill="#1f2022" font-size="12" font-weight="700">63 組手繪水墨圖元庫 (純代碼)</text>
      <text x="8" y="42" fill="#65625c" font-size="10">39 組唐詩圖元 (孤帆、寒山寺、枯松、宮燈...)</text>
      <text x="8" y="58" fill="#65625c" font-size="10">24 組名言圖元 (金石、青銅尊、織機、破棉...)</text>
      <text x="8" y="76" fill="#88847c" font-size="9" class="mono">極速平滑降級保障 (100% Graceful Fallback)</text>
    </g>

    <!-- Node 11: Paper Micro-Texture & Dual Blending -->
    <g id="node-textures" transform="translate(16, 310)">
      <rect x="0" y="0" width="276" height="102" rx="6" fill="url(#cardGrad)" stroke="#c8beac" stroke-width="1"/>
      <rect x="8" y="8" width="42" height="15" rx="2" fill="#76746f" fill-opacity="0.12"/>
      <text x="29" y="19" fill="#4a4844" font-size="8" font-weight="600" text-anchor="middle">CACHE</text>
      <text x="56" y="20" fill="#1f2022" font-size="12" font-weight="700">宣紙纖維緩存與雙軌物理動效</text>
      <text x="8" y="42" fill="#65625c" font-size="10">7,000 宣紙雜點 + 260 根拉絲纖維 (離屏 PAP)</text>
      <text x="8" y="58" fill="#65625c" font-size="10">墨水浸潤 Multiply ｜ 發光微粒 Screen 雙軌疊加</text>
      <text x="8" y="76" fill="#65625c" font-size="10">落雪、流螢、水波、晨霧粒子隨機動力學</text>
      <text x="8" y="92" fill="#88847c" font-size="9" class="mono">1500x900 畫布契約 ｜ 右下朱紅金石鈐印</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- CONNECTORS (Dry-brush inspired lines) -->
  <!-- ========================================== -->
  <!-- 1. Controls -> Dual-Track Audio (User presses Play / switches poem) -->
  <path d="M 288 236 L 314 236 Q 324 236 324 224 L 324 150 Q 324 138 334 138 L 344 138" 
        fill="none" stroke="#b03026" stroke-width="1.4" marker-end="url(#arrow-cinnabar)"/>
  <rect x="296" y="180" width="36" height="14" rx="2" fill="#fff9ee" stroke="#b03026" stroke-width="0.8"/>
  <text x="314" y="190" fill="#b03026" font-size="7" font-weight="700" text-anchor="middle" class="mono">PLAY</text>

  <!-- 2. Dual-Track Audio -> Follow-Reading State Machine -->
  <line x1="472" y1="212" x2="472" y2="228" stroke="#b03026" stroke-width="1.3" marker-end="url(#arrow-cinnabar)"/>
  <rect x="450" y="214" width="44" height="12" rx="2" fill="#fff9ee"/>
  <text x="472" y="223" fill="#b03026" font-size="7" class="mono" text-anchor="middle">TIMING</text>

  <!-- 3. State Machine -> Vertical Calligraphy View (Highlight active sentence) -->
  <path d="M 344 260 L 316 260 Q 306 260 306 244 L 306 138 Q 306 122 296 122 L 288 122" 
        fill="none" stroke="#4a4844" stroke-width="1.2" marker-end="url(#arrow-ink)"/>

  <!-- 4. Audio Core -> Fallback Watchdog (Error fallback) -->
  <path d="M 472 342 L 472 358" stroke="#76746f" stroke-width="1.1" stroke-dasharray="4 2" marker-end="url(#arrow-ink)"/>

  <!-- 5. State Machine -> 4-Stage Masking (The Core Hard Constraint: Reveal visual per sentence!) -->
  <path d="M 600 260 L 626 260 Q 636 260 636 244 L 636 238 Q 636 232 646 232 L 654 232" 
        fill="none" stroke="#b03026" stroke-width="1.5" marker-end="url(#arrow-cinnabar)"/>
  <rect x="606" y="244" width="46" height="14" rx="2" fill="#fff9ee" stroke="#b03026" stroke-width="0.8"/>
  <text x="629" y="254" fill="#b03026" font-size="7" font-weight="700" text-anchor="middle" class="mono">REVEAL</text>

  <!-- 6. Masterwork Artwork -> 4-Stage Masking (Mask slices artwork layers) -->
  <line x1="794" y1="184" x2="794" y2="190" stroke="#4a706e" stroke-width="1.2" marker-end="url(#arrow-celadon)"/>

  <!-- 7. Masking -> Primitives Fallback (If no custom artwork, run procedural) -->
  <line x1="794" y1="280" x2="794" y2="286" stroke="#b03026" stroke-width="1.2" marker-end="url(#arrow-cinnabar)"/>

  <!-- 8. Textures Cache -> Canvas Main Pipeline -->
  <line x1="794" y1="380" x2="794" y2="386" stroke="#4a4844" stroke-width="1.2" marker-end="url(#arrow-ink)"/>

  <!-- ========================================== -->
  <!-- LEGEND (Bottom Traditional Decorative Bar) -->
